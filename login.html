<body class="auth">
    <header>
        <div class="ham">
            <img src="./icons/hamburger.svg">
        </div>
        <h1><img src="./icons/logo-pizza.png" alt="rushing pizza logo"> Grillow</h1>
        <div class="log">
            <a class="account-btn" href="login.html">Login</a>
            <a class="account-btn-bold" href="signup.html">Sign Up</a>
        </div>
    </header>
    <div class="content">
        <nav> <!--navigation bar-->
            <div class="offscreen-menu">
            <ul class="services">
                <li id="on-page"><a href="index.html"><i class="fa-solid fa-house"></i><span>Home</span></a></li>
                <li><a href="browse.html"><i class="fa-solid fa-magnifying-glass"></i><span>Browse</span></a></li>
                <li><a href="orders.html"><i class="fa-solid fa-receipt"></i><span>Orders</span></a></li>
                <li><a href="favorites.html"><i class="fa-solid fa-star"></i><span>Favourites</span></a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a></li>
                <li><a href="help.html"><i class="fa-solid fa-circle-question"></i><span>Help</span></a></li>
            </ul>
            <ul class="partner">
                <li><a href="partnerform.html">Partner with us</a></li>
                <li><a href="driverform.html">Become a Driver</a></li>
                <li><a href="about.html">About us</a></li>
            </ul>
            </div>
        </nav>

        <div class="formparent">
        <form class="login">
            <h2>Login</h2>
            <label>
                <input type="email" name="email" placeholder="Email" autocomplete="email" required>
            </label>
            <label class="pass">
                <input class="password" type="password" placeholder="Password" name="password" required>
                <span class="eye"></span> <!--to add the eye icon-->
            </label>
                <a href="">Forgot your password?</a>

            <input type="submit" value="Login">

        </form>
        </div>
    </div>
    <aside id="theme-changer">
        <button id="default"></button><button id="theme2"></button><button id="theme3"></button>
    </aside>

    <script src="./script.js"></script>
